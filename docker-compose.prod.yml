services:
  nginx:
    image: nginx:1.27-alpine
    container_name: shared-finance-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_ssl:/etc/nginx/ssl:ro
      - certbot_challenges:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - frontend-net
    restart: always

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: shared-finance-frontend
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - frontend-net
    restart: always

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shared-finance-backend
    env_file:
      - .env.production
    environment:
      - ENVIRONMENT=production
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: shared-finance-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-shared_finance_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shared_finance_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net
    restart: always

  redis:
    image: redis:7-alpine
    container_name: shared-finance-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_password}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net
    restart: always

networks:
  frontend-net:
    driver: bridge
  backend-net:
    internal: true

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  nginx_ssl:
    driver: local
  certbot_challenges:
    driver: local
